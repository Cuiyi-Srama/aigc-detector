name: Build APK (Android + LLM Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: ☕ JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          ndk-version: '23.1.7779620'

      - name: 📦 Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 🔨 解压 llama.cpp 源码
        run: |
          cd android
          mkdir -p app/src/main/cpp
          tar -xzf cpp-src.tar.gz -C app/src/main/cpp/
          ls app/src/main/cpp/llama/ | head -3

      - name: 🔨 构建 Release APK (含 llama.cpp JNI 编译)
        run: |
          cd android
          rm -f local.properties   # 用 CI 的 ANDROID_HOME
          gradle assembleRelease --no-daemon

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AIGC-Detector-v8-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error