name: Build APK (Android + LLM Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: ☕ JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          ndk-version: '23.1.7779620'

      - name: 📦 Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 💾 Gradle 依赖缓存
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 💾 NDK 缓存 (避免每次下载 600MB)
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/23.1.7779620
          key: ${{ runner.os }}-ndk-23.1.7779620

      - name: 💾 llama.cpp 编译产物缓存 (增量编译, 源码不变秒级)
        uses: actions/cache@v5
        with:
          path: android/app/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('android/cpp-src.tar.gz', 'android/app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-cxx-

      - name: 🔨 解压 llama.cpp 源码
        run: |
          cd android
          mkdir -p app/src/main/cpp
          tar -xzf cpp-src.tar.gz -C app/src/main/cpp/
          ls app/src/main/cpp/llama/ | head -3

      - name: 🔨 构建 Release APK (含 llama.cpp JNI 编译)
        run: |
          cd android
          rm -f local.properties   # 用 CI 的 ANDROID_HOME
          gradle assembleRelease --no-daemon

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AIGC-Detector-v8-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error