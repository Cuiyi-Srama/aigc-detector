apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.aigc.detector'
    compileSdk 34
    ndkVersion "23.1.7779620"

    defaultConfig {
        applicationId "com.aigc.detector"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "8.0.3"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-O2 -fvisibility=hidden"
            }
        }
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_BASE64') != null) {
                storeFile file("${System.getenv('RUNNER_TEMP') ?: '/tmp'}/aigc-release.keystore")
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 固定 release 签名: CI 从 Secrets 解密 keystore, 保证跨版本签名一致可覆盖安装
            if (System.getenv('KEYSTORE_BASE64') != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // 零第三方依赖: WebView/Toast 均为 Android 框架 API
}